<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
<title id="t">Graft merge gate: both checks must pass</title>
<desc id="d">Design illustration of the planned merge gate, not yet implemented. A skill edit merges only if a permutation test on paired canary results is significant after Benjamini-Hochberg correction AND the median improvement is at least 10 percentage points. Three looping scenarios: significant but below the effect floor is rejected; a large effect that is not significant is rejected; only when both checks pass does the edit merge.</desc>
<style>.a{animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}.h{opacity:0}.k1_29{animation-name:k1_29}.k5_29{animation-name:k5_29}.k11_29{animation-name:k11_29}.k17_29{animation-name:k17_29}.k31_59{animation-name:k31_59}.k35_59{animation-name:k35_59}.k41_59{animation-name:k41_59}.k47_59{animation-name:k47_59}.k61_89{animation-name:k61_89}.k65_89{animation-name:k65_89}.k71_89{animation-name:k71_89}.k77_89{animation-name:k77_89}@keyframes k1_29{0%,1.11%{opacity:0}4.44%,28.89%{opacity:1}32.22%,100%{opacity:0}}@keyframes k5_29{0%,5.56%{opacity:0}8.89%,28.89%{opacity:1}32.22%,100%{opacity:0}}@keyframes k11_29{0%,12.22%{opacity:0}15.56%,28.89%{opacity:1}32.22%,100%{opacity:0}}@keyframes k17_29{0%,18.89%{opacity:0}22.22%,28.89%{opacity:1}32.22%,100%{opacity:0}}@keyframes k31_59{0%,34.44%{opacity:0}37.78%,62.22%{opacity:1}65.56%,100%{opacity:0}}@keyframes k35_59{0%,38.89%{opacity:0}42.22%,62.22%{opacity:1}65.56%,100%{opacity:0}}@keyframes k41_59{0%,45.56%{opacity:0}48.89%,62.22%{opacity:1}65.56%,100%{opacity:0}}@keyframes k47_59{0%,52.22%{opacity:0}55.56%,62.22%{opacity:1}65.56%,100%{opacity:0}}@keyframes k61_89{0%,67.78%{opacity:0}71.11%,95.56%{opacity:1}98.89%,100%{opacity:0}}@keyframes k65_89{0%,72.22%{opacity:0}75.56%,95.56%{opacity:1}98.89%,100%{opacity:0}}@keyframes k71_89{0%,78.89%{opacity:0}82.22%,95.56%{opacity:1}98.89%,100%{opacity:0}}@keyframes k77_89{0%,85.56%{opacity:0}88.89%,95.56%{opacity:1}98.89%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<g font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif">
<text x="24" y="36" font-size="19" font-weight="700" fill="#1f2328">Merge gate — a skill edit merges only if BOTH checks pass</text>
<g fill="none" stroke="#d1d9e0" stroke-width="1.5">
<rect x="24" y="86" width="470" height="50" rx="8"/>
<rect x="24" y="150" width="470" height="50" rx="8"/>
<path d="M494 111h30l18 26M494 175h30l18-26M602 143h12"/>
<circle cx="572" cy="143" r="30"/>
</g>
<text x="42" y="117" font-size="16" fill="#1f2328">Permutation test  p &lt; α (BH, α = 0.05)</text>
<text x="42" y="181" font-size="16" fill="#1f2328">Median Δ ≥ +10pp  (effect floor)</text>
<text x="572" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">AND</text>
<rect x="24" y="214" width="244" height="34" rx="17" fill="none" stroke="#d1d9e0"/><text x="146" y="236" text-anchor="middle" font-size="14" fill="#1f2328">Significant only → reject</text><rect x="278" y="214" width="244" height="34" rx="17" fill="none" stroke="#d1d9e0"/><text x="400" y="236" text-anchor="middle" font-size="14" fill="#1f2328">Large Δ only → reject</text><rect x="532" y="214" width="244" height="34" rx="17" fill="none" stroke="#d1d9e0"/><text x="654" y="236" text-anchor="middle" font-size="14" fill="#1f2328">Both pass → merge</text>
<g class="a k1_29 h"><text x="24" y="66" font-size="15" fill="#59636e">Scenario 1 of 3 — significant, but Δ below the floor</text><rect x="24" y="214" width="244" height="34" rx="17" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"/></g>
<g class="a k5_29 h"><circle cx="466" cy="111" r="15" fill="none" stroke="#1a7f37" stroke-width="2"/><path d="M459 111l5 5l9-10" stroke="#1a7f37" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="116" text-anchor="end" font-size="14" font-weight="600" fill="#1a7f37">pass</text></g>
<g class="a k11_29 h"><circle cx="466" cy="175" r="15" fill="none" stroke="#cf222e" stroke-width="2"/><path d="M460 169l12 12M472 169l-12 12" stroke="#cf222e" stroke-width="3" stroke-linecap="round"/><text x="440" y="180" text-anchor="end" font-size="14" font-weight="600" fill="#cf222e">fail</text></g>
<g class="a k17_29 h"><rect x="614" y="113" width="162" height="60" rx="10" fill="#cf222e" fill-opacity="0.12" stroke="#cf222e" stroke-width="2"/><text x="695" y="151" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="1" fill="#cf222e">REJECT</text></g>
<g class="a k31_59 h"><text x="24" y="66" font-size="15" fill="#59636e">Scenario 2 of 3 — large Δ, but not significant</text><rect x="278" y="214" width="244" height="34" rx="17" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"/></g>
<g class="a k35_59 h"><circle cx="466" cy="111" r="15" fill="none" stroke="#cf222e" stroke-width="2"/><path d="M460 105l12 12M472 105l-12 12" stroke="#cf222e" stroke-width="3" stroke-linecap="round"/><text x="440" y="116" text-anchor="end" font-size="14" font-weight="600" fill="#cf222e">fail</text></g>
<g class="a k41_59 h"><circle cx="466" cy="175" r="15" fill="none" stroke="#1a7f37" stroke-width="2"/><path d="M459 175l5 5l9-10" stroke="#1a7f37" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="180" text-anchor="end" font-size="14" font-weight="600" fill="#1a7f37">pass</text></g>
<g class="a k47_59 h"><rect x="614" y="113" width="162" height="60" rx="10" fill="#cf222e" fill-opacity="0.12" stroke="#cf222e" stroke-width="2"/><text x="695" y="151" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="1" fill="#cf222e">REJECT</text></g>
<g class="a k61_89"><text x="24" y="66" font-size="15" fill="#59636e">Scenario 3 of 3 — significant AND Δ at or above the floor</text><rect x="532" y="214" width="244" height="34" rx="17" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"/></g>
<g class="a k65_89"><circle cx="466" cy="111" r="15" fill="none" stroke="#1a7f37" stroke-width="2"/><path d="M459 111l5 5l9-10" stroke="#1a7f37" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="116" text-anchor="end" font-size="14" font-weight="600" fill="#1a7f37">pass</text></g>
<g class="a k71_89"><circle cx="466" cy="175" r="15" fill="none" stroke="#1a7f37" stroke-width="2"/><path d="M459 175l5 5l9-10" stroke="#1a7f37" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="180" text-anchor="end" font-size="14" font-weight="600" fill="#1a7f37">pass</text></g>
<g class="a k77_89"><rect x="614" y="113" width="162" height="60" rx="10" fill="#1a7f37" fill-opacity="0.12" stroke="#1a7f37" stroke-width="2"/><text x="695" y="151" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="1" fill="#1a7f37">MERGE</text></g>
<text x="24" y="284" font-size="13" font-style="italic" fill="#59636e">Design illustration — gate not yet implemented</text>
</g>
</svg>
