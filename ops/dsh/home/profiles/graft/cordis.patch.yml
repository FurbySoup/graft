# Graft "Standard" profile patch — layered over @deepseek-ai/dsh-base + dsh-headless
# (dsh 0.1.5-rc.3). Every deviation from the shipped defaults is listed in
# ops/VERSIONS.md with its reason. A patch entry replaces a row's WHOLE config.
#
# Invoke only through ops/scripts/dsh (sets DSH_HOME, disables telemetry).

# ── Network lockdown: localhost model endpoint only ────────────────────────────
# OTel session upload (default FEEDBACK_ONLY → harness-telemetry.deepseeksvc.com).
# The wrapper also sets DSH_TELEMETRY_DISABLED=1, which is the launcher-level
# opt-out; this row pin is belt-and-braces.
- id: session-telemetry-otel
  disabled: true

# Official-DeepSeek-API request enrichments (session-log upload, package inventory)
# and the DeepSeek cloud adapter itself. Graft never talks to a cloud model at runtime.
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: llm-deepseek
  disabled: true

# Web search / fetch (default: enabled, fetch without per-call approval).
# SPEC §7 bans live-web tasks; CLAUDE.md boundary: no network beyond localhost.
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
- id: tool-web
  disabled: true

# LLM-generated session titles: an extra doer call per session that is not part of
# the task. Disabled so every model request in the session log is task work.
- id: session-title-llm
  disabled: true

# ── Context control: the doer sees the task + what graft-trust injects, nothing else ─
# dsh-agent-instructions walks up from the workspace and injects any CLAUDE.md /
# AGENTS.md it finds (observed 2026-09-25: Graft's own CLAUDE.md, ~4K tokens, landed
# in the doer's context from data/smoke/dsh-ws). Ambient instruction files are an
# uncontrolled variable in every episode, so they are off. Skills reach the doer only
# via graft-trust, which logs every injection (SPEC §3.1).
- id: agent-instructions
  disabled: true

# ── Tool surface: file + shell tools only (R-01 context budget) ──────────────────
# dsh-base ships 23 model-facing tools; their schemas plus the matching system-prompt
# sections put the doer's FIRST request at 6,004 tokens of its 8,192 (measured
# 2026-09-26 via Ollama's task.n_tokens), leaving <2K to work in. Graft episodes need
# read/write/edit/glob/grep/bash only. Removed: agents (subagent*, list_agents,
# send_message, interrupt_agent), orchestration (workflow, ralph, goals), background
# jobs, todo, plan mode, the skill tool, and read_image (attachment store). The skill
# tool is also a context-control issue: skills reach the doer only via graft-trust.
# After: 6 tools, first request 2,043 tokens (ops/VERSIONS.md).
- id: tool-jobs
  disabled: true
- id: tool-skill
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: plan-mode
  disabled: true
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: attachment-local
  disabled: true

# ── Model: local Ollama via its OpenAI-compatible endpoint ─────────────────────
- id: llm-pi-ai
  config:
    providers:
      ollama-local:
        displayName: Ollama (localhost)
        # Ollama has no auth; pi-ai still refuses keyless routes. GRAFT_OLLAMA_KEY is a
        # fixed non-secret placeholder set by ops/scripts/dsh — never a credential.
        apiKeyEnv: GRAFT_OLLAMA_KEY
        api: openai-completions
        baseURL: http://localhost:11434/v1
        # Thinking mode ON, sent explicitly as reasoning_effort "high" rather than left
        # to Ollama's default (R-04, 2026-09-26: k=3 on the slugify kata — on 3/3 tier-1
        # PASS; off ("none") 3/3 EMPTY_RESPONSE: with tools present the non-thinking
        # output never reaches /v1). qwen3's thinking is a boolean; any non-"none"
        # effort means on. System prompt stays in the `system` role (not `developer`).
        reasoning: high
        compat:
          supportsReasoningEffort: true
          supportsDeveloperRole: false
        models:
          - id: graft-doer:8k
            name: Graft doer
            # NOT the real window. Ollama serves 8192 (num_ctx, graft-doer.Modelfile),
            # but pi-ai 0.85.1 caps every request's output at
            #   contextWindow − estimated prompt − 4096 (hard-coded CONTEXT_SAFETY_TOKENS),
            # sized for 100K+ windows. Declaring 8192 left ~1.7K output after a 2K prompt,
            # and 1 token at Phase 0's 6K prompt. 11264 = 8192 real − 1024 margin + 4096
            # pi-ai reserve, so prompt + output ≤ 7168 real tokens. compaction-basic
            # reads this figure too — its thresholdRatio below is set against it.
            # (R-01, measured 2026-09-26; ops/VERSIONS.md)
            contextWindow: 11264
            maxTokens: 4096
            reasoningEfforts:
              high: high
        retryPolicy:
          mode: normal
          maxRetries: 1

- id: agent-default-model
  config:
    provider: ollama-local
    model: graft-doer:8k

# ── Durable state goes to the gitignored data/ tree, not DSH_HOME ──────────────
- id: session-persistence-jsonl
  config:
    root: !!js process.env.GRAFT_REPO_ROOT + '/data/dsh-sessions'

# ── Compaction: thresholds against the declared 11264 (see llm-pi-ai above) ────
# Default 0.8 × 11264 = 9011 would exceed the real 8192 window. 0.5 × 11264 = 5632
# estimated tokens, leaving ≥1536 output tokens (7168 − 5632) at the threshold,
# including for the summarization request itself. retainRatio default 0.16 → 1802.
- id: compaction-basic
  config:
    thresholdRatio: 0.5
