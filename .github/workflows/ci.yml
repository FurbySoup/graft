# Minimal CI (SPEC §9 / BACKLOG P05-08): the same gate as the local pre-commit hook
# and the worker — typecheck, lint, TS tests, Python tests — on every PR and on main.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Enable pnpm (corepack, version from package.json)
        run: corepack enable pnpm && pnpm --version
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Gate
        run: ops/automation/gate.sh
